# Locked development environments of this checkout. Not a distributable package.
#
# Two reviewed dependency sets that one resolution cannot satisfy together (click,
# pydantic and pydantic-core differ; aiida-core 2.9.3 requires click<8.3), locked as two
# conflicting dependency groups in one uv.lock:
#
#   contract  application/requirements.lock, which contains integration/test-requirements.lock
#   native    the reviewed native development set (aiida-core 2.9.3 and its closure, pytest) and
#             ruff, the Python formatter and linter of the style ratchet (deployment/style_ratchet.py),
#             because ./hyprn-mvp dev check runs the test-group runner in this environment
#
# Every distribution is pinned exactly, so the lock holds exactly the reviewed versions; a
# version moves only after a dependency audit (docs/operations/dependency-audit.md).
# ./hyprn-mvp installs each group with `uv sync --frozen --no-build` into its own environment
# in the tool cache; the checkout's own packages are never installed into them.

[project]
name = "hyprn-mvp"
version = "0.1.0"
requires-python = "==3.12.15"
dependencies = []

[dependency-groups]
contract = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "click==8.5.0",
  "fastapi==0.143.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.20",
  "iniconfig==2.3.1",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "opentelemetry-api==1.45.1",
  "packaging==26.3",
  "pluggy==1.6.0",
  "pydantic==2.14.0",
  "pydantic-core==2.50.0",
  "pygments==2.21.0",
  "pytest==9.1.1",
  "referencing==0.37.0",
  "rfc8785==0.1.4",
  "rpds-py==2026.9.1",
  "starlette==1.7.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",

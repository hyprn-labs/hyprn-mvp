[tool.uv]
package = false
default-groups = []
conflicts = [[{ group = "contract" }, { group = "native" }]]
# Supported hosts only (macOS on Apple silicon, Linux x86_64 and aarch64 with glibc;
# Windows through WSL2 is Linux). Every locked distribution must have a wheel for each.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# Formatter and linter of the style ratchet (deployment/style_ratchet.py). The
# ratchet passes explicit file paths and --no-cache, so no cache folder is written into the
# checkout. Only the three readability rules are selected: `select` replaces ruff's default set.
[tool.ruff]
line-length = 100
target-version = "py312"
preview = false
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E501", "E702", "E703"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"
